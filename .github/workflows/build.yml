name: Build APK

# 专用构建仓库：只做一件事 —— 把 Operit 源码编译成 APK。
# 设计要点：
#   1. 源码不入库，构建时 clone 指定仓库/分支，仓库体积保持 0
#   2. 构建前释放磁盘（标准 runner 只有 14GB，Operit 全量构建会撑爆）
#   3. artifact 保留 7 天，避免像旧仓库那样堆到 10GB
#   4. Gradle 不用守护进程、不保留 build-cache

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '源码仓库 (owner/repo)'
        required: true
        default: 'CWIFISB1/Operit'
      ref:
        description: '分支或 commit'
        required: true
        default: 'main'
      build_type:
        description: 'assembleDebug / assembleRelease'
        required: true
        default: 'assembleDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 释放磁盘空间
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator \
                      /usr/local/lib/android/sdk/platforms/android-33 \
                      /usr/local/lib/android/sdk/platforms/android-34 2>/dev/null || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: 签出源码
        run: |
          set -e
          # terminal 是 git submodule，必须递归拉取，否则 :terminal 没有任何 variant
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          # 部分子模块用 SSH 地址（git@github.com:），runner 没有私钥，一并重写成 HTTPS
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "${{ inputs.ref }}" \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ inputs.repo }}.git" src \
            || {
              echo "::warning::递归拉取子模块失败，改为逐个容错拉取"
              rm -rf src
              git clone --depth 1 --branch "${{ inputs.ref }}" \
                "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ inputs.repo }}.git" src
              cd src
              # terminal 是构建必需，单独拉
              git submodule update --init --depth 1 terminal 2>&1 | tail -5
              # 其余子模块（hotbuild 工具链）拉不到就跳过
              git submodule status | awk '{print $2}' | grep -v '^terminal$' | while read sm; do
                git submodule update --init --depth 1 "$sm" 2>&1 | tail -2 || echo "::warning::跳过子模块 $sm"
              done
              cd ..
            }
          cd src
          git log --oneline -1
          echo "---- submodules ----"
          git submodule status || true
          ls terminal/ | head -5

      - name: 环境信息
        run: |
          java -version 2>&1 | head -3
          node --version || true
          df -h /

      - name: 固定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认 JDK
        run: java -version 2>&1 | head -3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/**/*.gradle*', 'src/gradle/**') }}
          restore-keys: gradle-

      - name: 安装指定 NDK
        run: |
          set -e
          NDK_VER=25.1.8937393
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk/"

      - name: Rust 工具链 + Android target
        run: |
          rustup target add aarch64-linux-android
          cargo --version
          rustc --version

      - name: 构建 native ripgrep（构建必需）
        working-directory: src
        run: |
          set -e
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cargo build --release --target aarch64-linux-android \
            --manifest-path tools/native_ripgrep/Cargo.toml
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
             app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          ls -lh app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: 配置 Gradle
        working-directory: src
        run: |
          set -e
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties

      - name: 构建
        working-directory: src
        run: |
          set -o pipefail
          ./gradlew ${{ inputs.build_type }} \
            --no-daemon --no-build-cache --stacktrace
          echo "---- 产物 ----"
          find . -name '*.apk' -not -path '*/intermediates/*' -exec ls -lh {} \;

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operit-apk-${{ inputs.build_type }}
          path: |
            src/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            src/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 3